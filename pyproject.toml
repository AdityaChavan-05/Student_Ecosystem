[project]
name = "student-ecosystem"
version = "1.0.0"
description = "A daily companion for MIT-WPU engineering students: campus updates, opportunities, AI news, mail summaries, an academic vault and a task hub."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4.0",
    "requests>=2.32,<3.0",
    "feedparser>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "google-genai>=1.0,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "pypdf>=5.0,<7.0",
    "gunicorn>=23.0,<24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.vercel]
entrypoint = "app:app"
